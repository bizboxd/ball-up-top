# Builds the iPhone app on GitHub's Macs. No Mac needed on your side.
#
# Without the App Store secrets it does a test build (checks everything compiles).
# With them it signs the app and uploads it to App Store Connect / TestFlight.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key ID (Users and Access > Integrations > App Store Connect API, role: Admin)
#   ASC_ISSUER_ID      Issuer ID shown on that same page
#   ASC_KEY_P8         Full contents of the downloaded AuthKey_XXXX.p8 file
#
# Ads (optional, repo Settings > Secrets and variables > Actions > Variables):
#   ADMOB_APP_ID       AdMob app ID (ca-app-pub-XXXX~YYYY). When set, the AdMob plugin is added
#                      and Info.plist gets GADApplicationIdentifier. Also put the banner unit ID
#                      in config.js (ADMOB_BANNER_ID). Leave unset for an ad-free build.
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "*.png"
      - "capacitor.config.json"
      - "package.json"
      - "resources/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.bizboxd.balluptop
      MARKETING_VERSION: "1.0.0"
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      # App Store uploads must be built with the iOS 26 SDK (Xcode 26 or later).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Some runner images ship this Xcode without the iOS platform; install it when missing.
      - name: Make sure the iOS platform is installed
        run: |
          if ! xcodebuild -showsdks 2>/dev/null | grep -qi "iphoneos"; then
            echo "iOS platform missing, downloading"
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Ads plugin (only when ADMOB_APP_ID is set)
        if: ${{ vars.ADMOB_APP_ID != '' }}
        run: npm install --no-audit --no-fund @capacitor-community/admob@^7

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: Icon, launch screen, Info.plist, entitlements
        run: |
          set -e
          APP=ios/App/App
          cp resources/icon.png "$APP/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          for f in "$APP"/Assets.xcassets/Splash.imageset/*.png; do cp resources/splash.png "$f"; done
          PL="$APP/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PL"; }
          pb "Add :ITSAppUsesNonExemptEncryption bool false"
          pb "Add :NSCameraUsageDescription string Take a profile picture for your Who Cooked profile."
          pb "Add :NSPhotoLibraryUsageDescription string Choose a profile picture for your Who Cooked profile."
          pb "Add :NSLocationWhenInUseUsageDescription string Who Cooked uses your location to show public pickup games near you and to pin where you are hosting. It is not saved to your profile."
          pb "Add :NSCalendarsUsageDescription string Add the games you are playing in to your calendar."
          pb "Add :NSCalendarsWriteOnlyAccessUsageDescription string Add the games you are playing in to your calendar."
          pb "Add :NSCalendarsFullAccessUsageDescription string Add the games you are playing in to your calendar."
          pb "Add :NSRemindersUsageDescription string Who Cooked does not use your reminders."
          pb "Add :NSRemindersFullAccessUsageDescription string Who Cooked does not use your reminders."
          for k in NSLocationWhenInUseUsageDescription NSCalendarsUsageDescription NSCalendarsWriteOnlyAccessUsageDescription NSCalendarsFullAccessUsageDescription; do /usr/libexec/PlistBuddy -c "Print :$k" "$PL" >/dev/null || { echo "Missing $k in Info.plist"; exit 1; }; done
          pb "Add :UIUserInterfaceStyle string Dark" || pb "Set :UIUserInterfaceStyle Dark"
          pb "Add :CFBundleURLTypes array"
          pb "Add :CFBundleURLTypes:0 dict"
          pb "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes array"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $BUNDLE_ID"
          if [ -n "$ADMOB_APP_ID" ]; then
            pb "Add :GADApplicationIdentifier string $ADMOB_APP_ID"
            pb "Add :SKAdNetworkItems array"
            pb "Add :SKAdNetworkItems:0 dict"
            pb "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork"
          fi
          cat > "$APP/App.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$APP/App.entitlements"
          # Bundle ID and entitlements go on the App target only (a command-line override would also
          # stamp the bundle ID onto embedded frameworks and Apple rejects the duplicate).
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s#PRODUCT_BUNDLE_IDENTIFIER = [^;]*;#PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_ENTITLEMENTS = App/App.entitlements;#" "$PBX"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBX"
          xcodebuild -version

      - name: Sync plugins
        run: npx cap sync ios

      - name: Pick project or workspace
        run: |
          if [ -d ios/App/App.xcworkspace ]; then echo "XC=-workspace ios/App/App.xcworkspace" >> $GITHUB_ENV; else echo "XC=-project ios/App/App.xcodeproj" >> $GITHUB_ENV; fi

      - name: Test build (no signing)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild $XC -scheme App -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          echo "::notice::Test build passed. Add the App Store secrets to sign and upload to TestFlight."

      - name: App Store Connect key
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild $XC -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=$MARKETING_VERSION | tail -n 60

      - name: Upload to App Store Connect
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "::notice::Uploaded build ${{ github.run_number }} to App Store Connect. It shows up in TestFlight after Apple finishes processing (usually 5-15 minutes)."
